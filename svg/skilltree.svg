<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="400">
  <defs>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Complex Network Connections -->
  <g stroke="url(#lineGrad)" stroke-width="2" opacity="0.6">
    <!-- Level 1 to 2 -->
    <path d="M 250 80 Q 150 150 100 200" fill="none"/>
    <path d="M 250 80 Q 350 150 400 200" fill="none"/>
    <path d="M 250 80 L 250 200" fill="none"/>
    
    <!-- Level 2 to 3 -->
    <path d="M 100 200 Q 100 280 50 320" fill="none"/>
    <path d="M 100 200 Q 150 280 150 320" fill="none"/>
    
    <path d="M 250 200 Q 200 280 200 320" fill="none"/>
    <path d="M 250 200 Q 300 280 300 320" fill="none"/>

    <path d="M 400 200 Q 350 280 350 320" fill="none"/>
    <path d="M 400 200 Q 450 280 450 320" fill="none"/>
  </g>

  <!-- Animated Data Packets traveling along lines -->
  <circle r="3" fill="#ffffff" filter="url(#neon)">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 250 80 Q 150 150 100 200"/>
  </circle>
  <circle r="3" fill="#ffffff" filter="url(#neon)">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 250 80 Q 350 150 400 200"/>
  </circle>
  <circle r="3" fill="#ffffff" filter="url(#neon)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 250 80 L 250 200"/>
  </circle>

  <!-- Node Elements -->
  <!-- Root: AI Core -->
  <circle cx="250" cy="80" r="30" fill="#0B1120" stroke="#00E5FF" stroke-width="3" filter="url(#neon)"/>
  <text x="250" y="85" font-family="'Orbitron', sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC" text-anchor="middle">CORE</text>

  <!-- Branch: Frontend -->
  <circle cx="100" cy="200" r="25" fill="#0B1120" stroke="#64FFDA" stroke-width="2"/>
  <text x="100" y="205" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#64FFDA" text-anchor="middle">FRONTEND</text>

  <!-- Branch: Backend -->
  <circle cx="250" cy="200" r="25" fill="#0B1120" stroke="#7B61FF" stroke-width="2"/>
  <text x="250" y="205" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#7B61FF" text-anchor="middle">BACKEND</text>

  <!-- Branch: Data -->
  <circle cx="400" cy="200" r="25" fill="#0B1120" stroke="#00E5FF" stroke-width="2"/>
  <text x="400" y="205" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#00E5FF" text-anchor="middle">DATA</text>

  <!-- Leaf Nodes (Small) -->
  <circle cx="50" cy="320" r="15" fill="#0B1120" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="50" y="324" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">React</text>
  
  <circle cx="150" cy="320" r="15" fill="#0B1120" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="150" y="324" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Vue</text>

  <circle cx="200" cy="320" r="15" fill="#0B1120" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="200" y="324" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Node</text>
  
  <circle cx="300" cy="320" r="15" fill="#0B1120" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="300" y="324" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Python</text>

  <circle cx="350" cy="320" r="15" fill="#0B1120" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="350" y="324" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">SQL</text>

  <circle cx="450" cy="320" r="15" fill="#0B1120" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="450" y="324" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Mongo</text>

  <!-- Radar sweep effect in background of core -->
  <circle cx="250" cy="80" r="45" fill="none" stroke="#00E5FF" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 250 80" to="360 250 80" dur="10s" repeatCount="indefinite"/>
  </circle>

</svg>
