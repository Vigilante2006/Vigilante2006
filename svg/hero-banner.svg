<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Demon Slayer inspired developer hero banner with moon, mist, and swordsman silhouette">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="55%" stop-color="#10141D"/>
      <stop offset="100%" stop-color="#171C28"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#EF4444" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes moonPulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes mistDrift {
        0% { transform: translateX(0); opacity: 0.25; }
        50% { transform: translateX(18px); opacity: 0.45; }
        100% { transform: translateX(0); opacity: 0.25; }
      }
      @keyframes ripple {
        0% { transform: translateX(-4%); opacity: 0.15; }
        50% { transform: translateX(4%); opacity: 0.35; }
        100% { transform: translateX(-4%); opacity: 0.15; }
      }
      @keyframes leafFloat {
        0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
        50% { transform: translateY(-10px) rotate(8deg); opacity: 1; }
      }
      @keyframes ember {
        0%, 100% { opacity: 0.2; transform: translateY(0); }
        50% { opacity: 0.9; transform: translateY(-12px); }
      }
      @keyframes swordGlow {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      .moon-group { animation: moonPulse 8s ease-in-out infinite; transform-origin: 900px 120px; }
      .mist-a { animation: mistDrift 14s ease-in-out infinite; }
      .mist-b { animation: mistDrift 18s ease-in-out infinite reverse; }
      .wave { animation: ripple 10s ease-in-out infinite; }
      .leaf { animation: leafFloat 7s ease-in-out infinite; }
      .leaf-2 { animation: leafFloat 9s ease-in-out infinite 1s; }
      .ember { animation: ember 4s ease-in-out infinite; }
      .blade-glow { animation: swordGlow 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#F8FAFC" opacity="0.35">
    <circle cx="120" cy="60" r="1.2"/><circle cx="280" cy="40" r="1"/><circle cx="450" cy="75" r="1.3"/>
    <circle cx="620" cy="35" r="1"/><circle cx="780" cy="55" r="1.4"/><circle cx="1050" cy="45" r="1.1"/>
    <circle cx="180" cy="130" r="0.9"/><circle cx="340" cy="110" r="1"/><circle cx="560" cy="95" r="0.8"/>
  </g>

  <!-- Torii-inspired gate (abstract, original) -->
  <g opacity="0.18" stroke="#EF4444" stroke-width="3" fill="none">
    <rect x="520" y="180" width="160" height="8" rx="2"/>
    <rect x="545" y="188" width="8" height="120"/>
    <rect x="647" y="188" width="8" height="120"/>
    <path d="M530 250 Q600 220 670 250"/>
  </g>

  <!-- Moon -->
  <g class="moon-group">
    <circle cx="900" cy="120" r="90" fill="url(#moonGlow)"/>
    <circle cx="900" cy="120" r="52" fill="#EF4444"/>
    <circle cx="918" cy="102" r="10" fill="#080B12" opacity="0.15"/>
  </g>

  <!-- Mist layers -->
  <g class="mist-a" fill="#CBD5E1">
    <ellipse cx="350" cy="280" rx="220" ry="35" opacity="0.12"/>
    <ellipse cx="700" cy="300" rx="180" ry="28" opacity="0.1"/>
  </g>
  <g class="mist-b" fill="#14B8A6">
    <ellipse cx="500" cy="320" rx="260" ry="40" opacity="0.08"/>
  </g>

  <!-- Water surface -->
  <rect x="0" y="420" width="1200" height="100" fill="#10141D"/>
  <path class="wave" d="M0 440 Q150 420 300 440 T600 440 T900 440 T1200 440 L1200 520 L0 520 Z" fill="url(#water)"/>
  <path class="wave" style="animation-delay:-3s" d="M0 460 Q200 445 400 460 T800 460 T1200 460 L1200 520 L0 520 Z" fill="#14B8A6" opacity="0.08"/>

  <!-- Original cloaked developer swordsman silhouette (no copyrighted character) -->
  <g transform="translate(560, 130)">
    <!-- Cloak -->
    <path d="M40 250 C10 180 20 90 60 40 C80 20 110 15 130 30 C150 10 180 15 200 35 C230 80 240 170 210 250 Z" fill="#171C28" stroke="#2A3242" stroke-width="2"/>
    <!-- Hood -->
    <ellipse cx="130" cy="55" rx="42" ry="38" fill="#10141D" stroke="#2A3242" stroke-width="2"/>
    <!-- Face shadow -->
    <ellipse cx="130" cy="62" rx="22" ry="26" fill="#080B12"/>
    <!-- Laptop instead of sword hilt -->
    <rect x="95" y="155" width="70" height="48" rx="4" fill="#2A3242" stroke="#14B8A6" stroke-width="1.5"/>
    <rect x="100" y="160" width="60" height="34" rx="2" fill="#080B12" opacity="0.8"/>
    <line x1="130" y1="203" x2="130" y2="230" stroke="#CBD5E1" stroke-width="3"/>
    <!-- Nichirin-inspired blade (abstract geometric) -->
    <g class="blade-glow" filter="url(#softGlow)">
      <rect x="124" y="70" width="12" height="90" rx="2" fill="url(#blade)" transform="rotate(-8 130 130)"/>
      <polygon points="130,70 138,58 122,58" fill="#EF4444" transform="rotate(-8 130 130)"/>
    </g>
    <!-- Breathing aura -->
    <ellipse cx="130" cy="180" rx="80" ry="60" fill="#14B8A6" opacity="0.06"/>
  </g>

  <!-- Floating maple leaves (original) -->
  <g class="leaf" fill="#EF4444">
    <path d="M150 200 C155 190 165 188 170 195 C175 188 185 190 180 200 C185 210 175 212 170 205 C165 212 155 210 150 200 Z"/>
  </g>
  <g class="leaf-2" fill="#F59E0B">
    <path d="M980 180 C985 170 995 168 1000 175 C1005 168 1015 170 1010 180 C1015 190 1005 192 1000 185 C995 192 985 190 980 180 Z"/>
  </g>

  <!-- Fire embers -->
  <circle class="ember" cx="420" cy="350" r="3" fill="#F59E0B"/>
  <circle class="ember" style="animation-delay:1.2s" cx="760" cy="330" r="2.5" fill="#EF4444"/>
  <circle class="ember" style="animation-delay:2s" cx="890" cy="360" r="2" fill="#F59E0B"/>

  <!-- Decorative kanji-style strokes (abstract, not actual copyrighted text) -->
  <g stroke="#2A3242" stroke-width="2" opacity="0.4" fill="none">
    <path d="M40 80 L40 200 M25 120 L55 120"/>
    <path d="M60 90 L80 110 L60 130"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="518" width="1200" height="2" fill="#EF4444" opacity="0.6"/>
</svg>
