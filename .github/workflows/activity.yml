name: Update Activity

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: JamesIves/github-readme-activity-log@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
